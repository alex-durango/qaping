name: Feature request
description: Suggest an improvement to Qaping or its documentation.
title: "[Idea] "
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the game-development task or documentation gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Share your proposed change and any examples.
    validations:
      required: true
